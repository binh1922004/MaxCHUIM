# ─── Benchmark Configuration for MaxCHUIM ───

# Path to the folder containing .hui files
hui_folder: "/home/ball/nckh/dataset/HUI"

# Path to the folder containing .pro files
pro_folder: "/home/ball/nckh/dataset/PRO"

# Number of times each (algorithm × dataset × threshold) is repeated
run_attempts: 3

# Algorithms to benchmark
algorithms:
  - MaxCHuim
  - MaxCHuimBitmax

# Datasets: each has a name and a list of thresholds
datasets:
  - name: BMS-POS
    thresholds: [0.005, 0.003, 0.001]  
  - name: connect
    thresholds: [0.7, 0.5, 0.1, 0.05]
  - name: chess
    thresholds: [0.15, 0.1, 0.05, 0.03, 0.01]
  - name: accidents
    thresholds: [0.1, 0.07, 0.05, 0.03, 0.01]
